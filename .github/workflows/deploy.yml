name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "profile_website/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    environment: github-pages  # so ACTIVITY_REPO, ACTIVITY_BRANCH, ACTIVITY_TOKEN are available
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "profile_website/package-lock.json"

      - name: Install dependencies
        run: npm install
        working-directory: profile_website

      - name: Generate Static Site
        run: npm run generate
        working-directory: profile_website
        env:
          # Repository variables (Settings → Secrets and variables → Actions → Variables)
          NUXT_PUBLIC_GTAG_ID: ${{ vars.NUXT_PUBLIC_GTAG_ID }}
          ACTIVITY_REPO: ${{ vars.ACTIVITY_REPO }}
          ACTIVITY_BRANCH: ${{ vars.ACTIVITY_BRANCH }}
          # Build-time only (not NUXT_PUBLIC_* — that prefix is inlined into the browser bundle).
          # Prefer Actions secrets. vars.NUXT_PUBLIC_GOOGLE_SHEET_* is a temporary fallback for the old name.
          GOOGLE_SHEET_ID_VIDEOS: ${{ secrets.GOOGLE_SHEET_ID_VIDEOS || vars.GOOGLE_SHEET_ID_VIDEOS || vars.NUXT_PUBLIC_GOOGLE_SHEET_ID_VIDEOS }}
          GOOGLE_SHEET_GID_VIDEOS: ${{ secrets.GOOGLE_SHEET_GID_VIDEOS || vars.GOOGLE_SHEET_GID_VIDEOS || vars.NUXT_PUBLIC_GOOGLE_SHEET_GID_VIDEOS }}
          # Repository secret (Settings → Secrets and variables → Actions → Secrets)
          ACTIVITY_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: profile_website/.output/public

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
